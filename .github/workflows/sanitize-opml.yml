name: Sanitize OPML

on:
  push:
    paths:
      - '**/*.opml'
  pull_request:
    paths:
      - '**/*.opml'
  workflow_dispatch:

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Sanitize OPML files
        run: python scripts/sanitize_opml.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sanitize OPML files"
            git push
          fi